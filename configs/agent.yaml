schema_version: 1
rule_version: gpu-detection-v1
max_tool_calls: 8
max_retries: 1
timeout_seconds: 180
model_initialization_timeout_seconds: 90
tool_timeout_seconds: 45
quality:
  minimum_side: 128
  maximum_pixels: 16777216
  minimum_contrast: 3.0
regions:
  minimum_pixels: 9
  maximum_regions: 4
  # 区域提取被截断时是否禁止 normal 结论。
  # false：正常件纹理噪声常产生 >4 个连通区，若一律禁止，越"正常"的图越判不了；
  # 报告仍保留 truncated 标记，人工可按需抽检。
  block_normal_when_truncated: false
