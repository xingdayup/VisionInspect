schema_version: 1
rule_version: gpu-detection-v1
max_tool_calls: 8
max_retries: 1
timeout_seconds: 180
model_initialization_timeout_seconds: 90
tool_timeout_seconds: 45
quality:
  minimum_side: 128
  maximum_pixels: 16777216
  minimum_contrast: 3.0
regions:
  minimum_pixels: 9
  maximum_regions: 4
  # 区域提取被截断时是否禁止 normal 结论。
  # false：正常件纹理噪声常产生 >4 个连通区，若一律禁止，越"正常"的图越判不了；
  # 报告仍保留 truncated 标记，人工可按需抽检。
  block_normal_when_truncated: false
  # unclear 区域是否重开一次补查。默认关闭：实测对一个仍为 unclear 的区域复用一次
  # 调用并不能改善判断，反而可能让模型在重看时给出更多局部 anomaly 观察。
  reopen_unclear_regions: false
  # 局部视图是否同时给出两张正常参考。实测对 11 个正常区域：unclear 从 3 降到 0，
  # 误报不增加；代价是局部视图不再包含待检原图（一次最多 3 张）。
  two_references: true
