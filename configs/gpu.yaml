schema_version: 1
enabled: true
# 示例路径：每个实例都必须用 VISIONINSPECT_GPU_ROOT 覆盖（AutoDL: source scripts/env_autodl.sh）
root: /mnt/systemDisk/VisionInspect-GPU
python: /usr/local/bin/python3
endpoint: http://127.0.0.1:8001
model: visioninspect-vlm
idle_ttl_seconds: 600
startup_timeout_seconds: 300
request_timeout_seconds: 45
# 1 次整体 + 每个疑似区域 1 次局部 + 1 次结束；区域上限为 4，故上限取 6
max_model_calls: 6
server_memory_limit_gib: 24
project_memory_limit_gib: 28
