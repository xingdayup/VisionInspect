schema_version: 1
dataset:
  name: mvtec_ad
  category: bottle
  root: data/mvtec_ad/bottle
  manifest: data/manifests/bottle.json
  image_size: 900
  expected_train: 209
  expected_test_good: 20
  expected_test_anomaly: 63
  defects: [broken_large, broken_small, contamination]
  validation_ratio: 0.2
model:
  backend: efficientad_s
  image_size: 256
  teacher_weights: weights/efficientad/pretrained_teacher_small.pth
  teacher_metadata: weights/efficientad/source.json
  teacher_out_channels: 384
  padding: false
  pad_maps: true
training:
  steps: 70000
  learning_rate: 0.0001
  weight_decay: 0.00001
  regularizer_manifest: data/manifests/imagenette-authorized.json
  description: Full student-teacher hard loss plus OOD penalty, autoencoder and student-AE losses
runtime:
  seed: 42
  device: cpu
  precision: float32
  threads: 4
  batch_size: 1
  num_workers: 0
  memory_limit_gib: 12
  smoke_timeout_seconds: 600
  fit_timeout_seconds: 3600
  calibrate_timeout_seconds: 900
  evaluate_timeout_seconds: 900
evaluation:
  quantile: 0.95
  quantile_method: higher
  aupro_fpr_limit: 0.3
  warmup: 5
outputs: outputs
