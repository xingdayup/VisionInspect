[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visioninspect-agent"
version = "0.4.0"
description = "Local CPU visual inspection baseline, bounded Agent and research workstation"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
include = ["visioninspect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
