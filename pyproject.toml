[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visioninspect-agent"
version = "0.5.0"
description = "CUDA PatchCore and vLLM evidence-review workstation"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
include = ["visioninspect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Deployment scripts adjust sys.path before importing project modules.
"scripts/*.py" = ["E402"]
